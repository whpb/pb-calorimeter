[tool.poetry]
package-mode = false

[project]
name = "valve-tests-2"
version = "0.1.0"
description = "Replacement for HL's ValveTests scripts"
authors = [
    {name = "Will Beamish"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pathlib (>=1.0.1,<2.0.0)",
    "pymodbus (>=3.14.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
