[tool.poetry]
package-mode = false

[project]
name = "pb-calorimeter"
version = "0.1.0"
description = "Indirect calorimetric measurements on the Polar Bear"
authors = [
    {name = "Will Beamish"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymodbus (>=3.14.0,<4.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "pillow (>=11.0.0,<13.0.0)",
    "typst (>=0.15.0,<0.16.0)",
    "imageio (>=2.37.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "nuitka (>=4.2,<5.0)"
]

[tool.pytest.ini_options]
# the repo is a script project, not a package, so tests import functions/ from the root
pythonpath = ["."]
testpaths = ["tests"]
